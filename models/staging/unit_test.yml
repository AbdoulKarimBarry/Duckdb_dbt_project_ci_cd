unit_tests:
      - name: test_is_not_negative_amount
        model: stg_payements
        description: tester si le montant de la commmande n'est pas negative sinon * -1
        given:
          - input: source('raw', 'raw_payments') 
            format: dict 
            rows:
              - { amount: -15 } 
              - { amount: -10 } 
              - { amount: -1 } 
        expect:
          format: dict 
          rows:
            - { amount: 15 }
            - { amount: 10 }
            - { amount: 1 }
